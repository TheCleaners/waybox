# A GitHub Actions port of the old .build.yml.  This has the advantage of being
# able to use GitHub actions, contexts, secrets, etc, to do more in the future
# than merely check whether a build succeeds or fails.  It also allows to see
# whether builds succeed or fail on forks, which also has its advantages.
#
# The disadvantage is that it's less portable than .build.yml, which will work
# on at least GitHub, GitLab, and SourceHut, where GitHub Actions only work on
# GitHub.
#
name: build
on: [push, pull_request]

# Compiles are cached with ccache (meson uses it once it's installed). The
# cache lives in the workspace (.ccache), so a container, or a VM job that
# copies the workspace in and back (FreeBSD through vmactions/freebsd-vm with
# copyback), carries it the same way; each job and matrix combination has
# its own (the key is the job's name and every matrix value), so a new axis
# gets its own cache with nothing to change here. Each run saves its own;
# the next restores the latest of its kind (this branch's, else master's).
env:
    CCACHE_MAXSIZE: 400M
    CCACHE_COMPRESS: "true"

jobs:
    # gcc (release) and clang (debug) side by side: two jobs at once rather
    # than one after the other. Neither cancels the other on failure.
    build:
        name: build (${{ matrix.compiler }})
        runs-on: ubuntu-latest
        container: alpine:edge
        strategy:
            fail-fast: false
            matrix:
                include:
                    - compiler: gcc
                      cc: gcc
                      cxx: g++
                      buildtype: release
                    - compiler: clang
                      cc: clang
                      cxx: clang++
                      buildtype: debug
        steps:
            - name: packages
              run: |
                apk add tar zstd ccache clang g++ gcc luajit-dev cairo-dev pango-dev font-dejavu fontconfig libevdev-dev libinput-dev libxkbcommon-dev libxml2-dev meson musl-dev wayland-dev wayland-protocols wlroots wlroots-dev xwayland foot wtype wlrctl python3 grim imagemagick xvfb py3-xlib wlr-randr scdoc texinfo
                fc-cache -f || true
            # actions/checkout@v7 clones the repository
            - uses: actions/checkout@v7
            - name: ccache
              uses: actions/cache@v6
              with:
                  path: .ccache
                  key: ccache-${{ github.job }}-${{ join(matrix.*, '-') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: ccache-${{ github.job }}-${{ join(matrix.*, '-') }}-
            - name: build-and-test
              run: |
                export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
                ccache -z
                CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} meson setup build -Dsanitize=disabled --buildtype=${{ matrix.buildtype }}
                ninja -C build
                ccache -s
                meson test -C build --print-errorlogs

    # Run the dependency-free unit tests under AddressSanitizer +
    # UndefinedBehaviorSanitizer. This uses a stock Ubuntu image (which has
    # libasan/libubsan) and the tests_only build, so it needs no wlroots — the
    # pure logic (geometry, placement, actions, ...) is exercised sanitized on
    # every push, which the Alpine build cannot do (its toolchain lacks the
    # sanitizer runtimes).
    sanitized-tests:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: ccache
              uses: actions/cache@v6
              with:
                  path: .ccache
                  key: ccache-${{ github.job }}-${{ join(matrix.*, '-') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: ccache-${{ github.job }}-${{ join(matrix.*, '-') }}-
            - name: packages
              run: |
                sudo apt-get update
                sudo apt-get install -y ccache meson ninja-build g++ python3
            - name: build-and-test
              run: |
                export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
                ccache -z
                CC=gcc CXX=g++ meson setup build-asan -Dtests_only=true -Dsanitize=enabled
                ninja -C build-asan
                ccache -s
                meson test -C build-asan --print-errorlogs
