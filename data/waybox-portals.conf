# xdg-desktop-portal backends for Waybox (XDG_CURRENT_DESKTOP=Waybox).
# Screenshots and screen sharing go through xdg-desktop-portal-wlr (which
# uses ext-image-copy-capture); everything else (file pickers, app chooser,
# settings, ...) through xdg-desktop-portal-gtk. Override per user in
# ~/.config/xdg-desktop-portal/waybox-portals.conf.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
